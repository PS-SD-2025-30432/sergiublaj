spring:
  application:
    name: chef-mgmt-backend
  artemis:
    broker-url: tcp://localhost:61616
    mode: native
  datasource:
    url: jdbc:postgresql://localhost:5432/chef_mgmt_db
    username: postgres
    password: postgres
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/data
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  swagger-ui:
    enabled: true
security:
  secret-key: PS-SD-2025-30432-1q2w3e4r5t6y7u8i9o0p
  token-expiration-days: 15
server:
  port: 8777
  servlet:
    context-path: '/api'
chef-mgmt-mail:
  sync-mail-url: http://localhost:8888/api/v1/mail/sync
  async-mail-request-queue: mail-request-queue
